name: TestSuites

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Set up CI matrix
    runs-on: ubuntu-24.04
    outputs:
      config: ${{ steps.matrix.outputs.config }}
      autopas_ref: ${{ steps.autopas_ref.outputs.ref }}
    steps:
      - name: Check out current AutoPas master
        uses: actions/checkout@v4
        with:
          repository: AutoPas/AutoPas
          ref: master
          path: AutoPas

      - name: Resolve AutoPas revision
        id: autopas_ref
        run: echo "ref=$(git -C AutoPas rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Select build matrix
        id: matrix
        shell: bash
        run: |
          read -r -d '' full_matrix <<'JSON' || true
          [
            {"name":"GCC-Release-OMP-SingleSite","cc":"gcc","cxx":"g++","build_type":"Release","omp":"ON","asan":"OFF","tsan":"OFF","site":"SINGLESITE","autovec":"ON","avx":"OFF","hwy":"ON","test_scope":"full"},
            {"name":"Clang-Release-ASan-SingleSite","cc":"clang","cxx":"clang++","build_type":"Release","omp":"OFF","asan":"ON","tsan":"OFF","site":"SINGLESITE","autovec":"ON","avx":"OFF","hwy":"ON","test_scope":"full"},
            {"name":"Clang-Release-OMP-TSan-SingleSite","cc":"clang","cxx":"clang++","build_type":"Release","omp":"ON","asan":"OFF","tsan":"ON","site":"SINGLESITE","autovec":"ON","avx":"OFF","hwy":"OFF","test_scope":"tsan-unit"},
            {"name":"GCC-Release-OMP-MultiSite","cc":"gcc","cxx":"g++","build_type":"Release","omp":"ON","asan":"OFF","tsan":"OFF","site":"MULTISITE","autovec":"ON","avx":"OFF","hwy":"OFF","test_scope":"full"},
            {"name":"Clang-Release-ASan-MultiSite","cc":"clang","cxx":"clang++","build_type":"Release","omp":"OFF","asan":"ON","tsan":"OFF","site":"MULTISITE","autovec":"ON","avx":"OFF","hwy":"OFF","test_scope":"full"},
            {"name":"Clang-Debug-CompileOnly-SingleSite","cc":"clang","cxx":"clang++","build_type":"Debug","omp":"ON","asan":"OFF","tsan":"OFF","site":"SINGLESITE","autovec":"ON","avx":"OFF","hwy":"ON","test_scope":"compile-only"}
          ]
          JSON

          read -r -d '' light_matrix <<'JSON' || true
          [
            {"name":"GCC-Release-OMP-SingleSite","cc":"gcc","cxx":"g++","build_type":"Release","omp":"ON","asan":"OFF","tsan":"OFF","site":"SINGLESITE","autovec":"ON","avx":"OFF","hwy":"ON","test_scope":"full"}
          ]
          JSON

          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.draft }}" == "true" ]]; then
            echo "Draft pull request: using the light matrix."
            matrix_json="$light_matrix"
          else
            echo "Using the full matrix."
            matrix_json="$full_matrix"
          fi

          echo "config=$(jq -c . <<< "$matrix_json")" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and test ${{ matrix.config.name }}
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.config) }}
    env:
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      TSAN_OPTIONS: ignore_noninstrumented_modules=1
    steps:
      - name: Check out AutoPasDM
        uses: actions/checkout@v4
        with:
          path: AutoPasDM

      - name: Check out matching AutoPas revision
        uses: actions/checkout@v4
        with:
          repository: AutoPas/AutoPas
          ref: ${{ needs.setup.outputs.autopas_ref }}
          path: AutoPas

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libomp-dev libopenmpi-dev ninja-build openmpi-bin

      - name: Configure
        run: |
          sanitizer_link_flag=""
          if [[ "${{ matrix.config.asan }}" == "ON" ]]; then
            sanitizer_link_flag="-fsanitize=address"
          elif [[ "${{ matrix.config.tsan }}" == "ON" ]]; then
            sanitizer_link_flag="-fsanitize=thread"
          fi

          CC=${{ matrix.config.cc }} CXX=${{ matrix.config.cxx }} \
          cmake -S AutoPasDM -B AutoPasDM/build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }} \
            -DCMAKE_EXE_LINKER_FLAGS="${sanitizer_link_flag}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${sanitizer_link_flag}" \
            -DAUTOPAS_SOURCE_DIR="${GITHUB_WORKSPACE}/AutoPas" \
            -DAUTOPASDM_BUILD_EXAMPLES=ON \
            -DAUTOPASDM_BUILD_TESTS=ON \
            -DAUTOPAS_OPENMP=${{ matrix.config.omp }} \
            -DAUTOPAS_ENABLE_ADDRESS_SANITIZER=${{ matrix.config.asan }} \
            -DAUTOPAS_ENABLE_THREAD_SANITIZER=${{ matrix.config.tsan }} \
            -DAUTOPAS_INTERNODE_TUNING=ON \
            -DAUTOPAS_USE_AUTOVEC=OFF \
            -DMD_FLEXIBLE_MODE=${{ matrix.config.site }} \
            -DMD_FLEXIBLE_FUNCTOR_AUTOVEC=${{ matrix.config.autovec }} \
            -DMD_FLEXIBLE_FUNCTOR_AVX=${{ matrix.config.avx }} \
            -DMD_FLEXIBLE_FUNCTOR_HWY=${{ matrix.config.hwy }} \
            -DMD_FLEXIBLE_FUNCTOR_SVE=OFF \
            -DMD_FLEXIBLE_USE_MPI=ON \
            -DMD_FLEXIBLE_ENABLE_ALLLBL=OFF

      - name: Build
        run: cmake --build AutoPasDM/build-ci --parallel 2

      - name: Build original md-flexible reference
        if: matrix.config.name == 'GCC-Release-OMP-SingleSite'
        run: |
          CC=gcc CXX=g++ cmake -S AutoPas -B AutoPas/build-reference -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUTOPAS_BUILD_EXAMPLES=ON \
            -DAUTOPAS_BUILD_TESTS=OFF \
            -DAUTOPAS_BUILD_MD_LIBRARY=ON \
            -DAUTOPAS_BUILD_SPH_LIBRARY=ON \
            -DAUTOPAS_OPENMP=ON \
            -DAUTOPAS_ENABLE_ENERGY_MEASUREMENTS=OFF \
            -DAUTOPAS_INTERNODE_TUNING=ON \
            -DMD_FLEXIBLE_FUNCTOR_AUTOVEC=ON \
            -DMD_FLEXIBLE_MODE=SINGLESITE \
            -DMD_FLEXIBLE_USE_MPI=ON
          cmake --build AutoPas/build-reference --target md-flexible --parallel 2

      - name: Compare AutoPas and AutoPasDM simulations
        if: matrix.config.name == 'GCC-Release-OMP-SingleSite'
        run: |
          python3 AutoPasDM/examples/md-flexible/tests/scripts/run_load_balancing_regression.py \
            --reference AutoPas/build-reference/examples/md-flexible/md-flexible \
            --distributed AutoPasDM/build-ci/examples/md-flexible/md-flexible \
            --config AutoPasDM/examples/md-flexible/tests/yamlTestFiles/autopasdm_load_balancing_compare.yaml \
            --ranks 8

      - name: Compare 3D forces between AutoPas and AutoPasDM
        if: matrix.config.name == 'GCC-Release-OMP-SingleSite'
        run: |
          python3 AutoPasDM/examples/md-flexible/tests/scripts/run_md_flexible_comparison.py \
            --reference AutoPas/build-reference/examples/md-flexible/md-flexible \
            --distributed AutoPasDM/build-ci/examples/md-flexible/md-flexible \
            --config AutoPasDM/examples/md-flexible/tests/yamlTestFiles/autopasdm_force_compare_3d.yaml \
            --ranks 8

      - name: Compare dynamic simulations between AutoPas and AutoPasDM
        if: matrix.config.name == 'GCC-Release-OMP-SingleSite'
        run: |
          python3 AutoPasDM/examples/md-flexible/tests/scripts/run_md_flexible_comparison.py \
            --reference AutoPas/build-reference/examples/md-flexible/md-flexible \
            --distributed AutoPasDM/build-ci/examples/md-flexible/md-flexible \
            --config AutoPasDM/examples/md-flexible/tests/yamlTestFiles/autopasdm_dynamic_compare.yaml \
            --ranks 8

      - name: Compare thermostat between AutoPas and AutoPasDM
        if: matrix.config.name == 'GCC-Release-OMP-SingleSite'
        run: |
          output_dir="${RUNNER_TEMP}/thermostat-comparison"
          python3 AutoPasDM/examples/md-flexible/tests/scripts/run_md_flexible_comparison.py \
            --reference AutoPas/build-reference/examples/md-flexible/md-flexible \
            --distributed AutoPasDM/build-ci/examples/md-flexible/md-flexible \
            --config AutoPasDM/examples/md-flexible/tests/yamlTestFiles/autopasdm_thermostat_compare.yaml \
            --reference-ranks 1 \
            --distributed-ranks 4 \
            --keep-output "$output_dir"
          python3 AutoPasDM/examples/md-flexible/tests/scripts/compare_vtk_thermostat.py \
            "$output_dir/reference" "$output_dir/distributed"

      - name: Check reflective boundaries and wall forces
        if: matrix.config.name == 'GCC-Release-OMP-SingleSite'
        run: |
          set -euo pipefail
          executable="${GITHUB_WORKSPACE}/AutoPasDM/build-ci/examples/md-flexible/md-flexible"
          config="${GITHUB_WORKSPACE}/AutoPasDM/examples/md-flexible/tests/yamlTestFiles/autopasdm_reflective_compare.yaml"
          output_dir="${RUNNER_TEMP}/reflective-comparison"
          mkdir -p "$output_dir/np1" "$output_dir/np8"
          mpirun -np 1 "$executable" --yaml-filename "$config" \
            --vtk-output-folder "$output_dir/np1"
          mpirun -np 8 "$executable" --yaml-filename "$config" \
            --vtk-output-folder "$output_dir/np8"
          python3 AutoPasDM/examples/md-flexible/tests/scripts/compare_vtk_forces.py \
            "$output_dir/np1" "$output_dir/np8"
          python3 AutoPasDM/examples/md-flexible/tests/scripts/check_reflective_forces.py \
            "$output_dir/np8"

      - name: Build original multi-site md-flexible reference
        if: matrix.config.name == 'GCC-Release-OMP-MultiSite'
        run: |
          CC=gcc CXX=g++ cmake -S AutoPas -B AutoPas/build-reference-multisite -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUTOPAS_BUILD_EXAMPLES=ON \
            -DAUTOPAS_BUILD_TESTS=OFF \
            -DAUTOPAS_BUILD_MD_LIBRARY=ON \
            -DAUTOPAS_BUILD_SPH_LIBRARY=ON \
            -DAUTOPAS_OPENMP=ON \
            -DAUTOPAS_ENABLE_ENERGY_MEASUREMENTS=OFF \
            -DAUTOPAS_INTERNODE_TUNING=ON \
            -DMD_FLEXIBLE_FUNCTOR_AUTOVEC=ON \
            -DMD_FLEXIBLE_FUNCTOR_AVX=OFF \
            -DMD_FLEXIBLE_FUNCTOR_HWY=OFF \
            -DMD_FLEXIBLE_FUNCTOR_SVE=OFF \
            -DMD_FLEXIBLE_MODE=MULTISITE \
            -DMD_FLEXIBLE_USE_MPI=ON
          cmake --build AutoPas/build-reference-multisite --target md-flexible --parallel 2

      - name: Compare multi-site simulations between AutoPas and AutoPasDM
        if: matrix.config.name == 'GCC-Release-OMP-MultiSite'
        run: |
          python3 AutoPasDM/examples/md-flexible/tests/scripts/run_md_flexible_comparison.py \
            --reference AutoPas/build-reference-multisite/examples/md-flexible/md-flexible \
            --distributed AutoPasDM/build-ci/examples/md-flexible/md-flexible \
            --config AutoPasDM/examples/md-flexible/tests/yamlTestFiles/autopasdm_multisite_compare.yaml \
            --ranks 8

      - name: Run full CTest suite
        if: matrix.config.test_scope == 'full'
        run: |
          if [[ "${{ matrix.config.asan }}" == "ON" ]]; then
            export LSAN_OPTIONS="suppressions=${GITHUB_WORKSPACE}/AutoPas/.lsanIgnoreList.txt:ignore_noninstrumented_modules=1"
          fi
          if [[ "${{ matrix.config.site }}" == "MULTISITE" ]]; then
            ctest --test-dir AutoPasDM/build-ci -C checkExamples \
              --output-on-failure \
              -E '^md-flexible\.test-(sim|static)$'
          else
            ctest --test-dir AutoPasDM/build-ci -C checkExamples --output-on-failure
          fi

      - name: Run non-MPI tests with ThreadSanitizer
        if: matrix.config.test_scope == 'tsan-unit'
        env:
          # Avoid PMIx shared-memory mappings conflicting with TSan's shadow memory.
          PMIX_MCA_gds: hash
        run: >-
          ctest --test-dir AutoPasDM/build-ci -C checkExamples
          --output-on-failure
          -R '^AutoPasDM/(DomainDecompositionTest|PerformanceCountersTest|InvertedPressureTest|ReflectiveBoundaryTest|MultisiteReflectiveBoundaryTest|MoleculeLJParticleSerializerTest|mdFlex/)'

  style:
    name: Style check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out AutoPasDM
        uses: actions/checkout@v4
        with:
          path: AutoPasDM

      - name: Check out AutoPas
        uses: actions/checkout@v4
        with:
          repository: AutoPas/AutoPas
          ref: master
          path: AutoPas

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-14 cmake libopenmpi-dev openmpi-bin

      - name: Configure
        run: >-
          cmake -S AutoPasDM -B AutoPasDM/build-style
          -DAUTOPAS_SOURCE_DIR="${GITHUB_WORKSPACE}/AutoPas"
          -DAUTOPASDM_BUILD_EXAMPLES=OFF
          -DAUTOPASDM_BUILD_TESTS=OFF

      - name: Check formatting
        run: |
          cmake --build AutoPasDM/build-style --target autopasdm_clangformat
          git -C AutoPasDM diff --check
          git -C AutoPasDM diff --exit-code

  documentation:
    name: Documentation check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out AutoPasDM
        uses: actions/checkout@v4
        with:
          path: AutoPasDM

      - name: Check out AutoPas
        uses: actions/checkout@v4
        with:
          repository: AutoPas/AutoPas
          ref: master
          path: AutoPas

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake doxygen graphviz libopenmpi-dev openmpi-bin

      - name: Configure documentation
        run: >-
          cmake -S AutoPasDM -B AutoPasDM/build-docs
          -DAUTOPAS_SOURCE_DIR="${GITHUB_WORKSPACE}/AutoPas"
          -DAUTOPASDM_BUILD_EXAMPLES=OFF
          -DAUTOPASDM_BUILD_TESTS=OFF
          -DAUTOPAS_BUILD_TARGET_DOC=ON

      - name: Build API documentation
        run: cmake --build AutoPasDM/build-docs --target doc_doxygen
