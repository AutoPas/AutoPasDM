# Small two-rank simulation for the md-flexible ALL/TENSOR integration test.
# The dense cluster starts entirely on one side of the initial x split, so the
# first balancing step receives distinct measured work values from the ranks.

container: [DirectSum]
traversal: [ds_sequential]
data-layout: [AoS]
newton3: [disabled]
functor: lennard-jones

cutoff: 0.75
verlet-skin-radius: 0.0
tuning-strategies: []
tuning-phases: 0

box-min: [0.0, 0.0, 0.0]
box-max: [8.0, 8.0, 8.0]

deltaT: 1.0e-12
iterations: 2

boundary-type: [periodic, periodic, periodic]
subdivide-dimension: [true, true, true]
load-balancer: all
load-balancing-interval: 1

no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 0.2
    mass: 1.0

Molecules:
  0:
    site-types: [0]
    relative-site-positions: [[0.0, 0.0, 0.0]]
    moment-of-inertia: [1.0, 1.0, 1.0]

Objects:
  CubeGrid:
    0:
      particles-per-dimension: [5, 5, 5]
      particle-spacing: 0.25
      bottomLeftCorner: [0.5, 0.5, 0.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    1:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.25
      bottomLeftCorner: [6.0, 6.0, 6.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
