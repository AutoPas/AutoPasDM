# Initial state for the md-flexible CLI checkpoint restart regression.

container: [DirectSum]
traversal: [ds_sequential]
data-layout: [AoS]
newton3: [disabled]
functor: lennard-jones

cutoff: 0.5
verlet-skin-radius: 0.0
tuning-strategies: []
tuning-phases: 0

box-min: [0.0, 0.0, 0.0]
box-max: [8.0, 2.0, 2.0]

deltaT: 0.0
iterations: 1

boundary-type: [periodic, periodic, periodic]
load-balancer: none

no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 0.2
    mass: 1.0

Molecules:
  0:
    site-types: [0]
    relative-site-positions: [[0.0, 0.0, 0.0]]
    moment-of-inertia: [1.0, 1.0, 1.0]

Objects:
  CubeGrid:
    0:
      particles-per-dimension: [8, 1, 1]
      particle-spacing: 1.0
      bottomLeftCorner: [0.5, 0.5, 0.5]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
