container: [DirectSum, LinkedCells]
verlet-rebuild-frequency: 15
verlet-skin-radius: 0.1
fastParticlesThrow: true

selector-strategy: Fastest-Absolute-Value
tuning-strategies: []
tuning-metric: time
tuning-interval: 1000
tuning-samples: 10
use-LOESS-smoothening: false

functor: Lennard-Jones (12-6)
traversal: [ds_sequential, lc_c01, lc_c08]
data-layout: [AoS, SoA]
newton3: [disabled, enabled]

vectorization-pattern:
  [NotApplicable, 1xVectorLength, 2xVectorLengthDiv2, VectorLengthDiv2x2, VectorLengthx1]

cutoff: 2.5
box-min: [0, 0, 0]
box-max: [8, 8, 8]
cell-size: [1]

deltaT: 0.1
pause-simulation-during-tuning: true
aos-sorting-threshold: 8
soa-sorting-threshold: 50
tuning-phases: 1

boundary-type: [periodic, periodic, periodic]

globalForce: [1, 0, 0]

Sites:
  0:
    epsilon: 1
    sigma: 1
    nu: 0
    mass: 1

Objects:
  CubeGrid:
    0:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 1.1225
      bottomLeftCorner: [0.5, 0.5, 0.5]
      velocity: [0.25, -0.5, 0.1]
      particle-type-id: 0

use-tuning-logger: false
output-suffix: ""
log-level: info
no-end-config: true
no-progress-bar: false

load-balancer: None
load-balancing-interval: 10
subdivide-dimension: [true, true, true]
energy-sensor: rapl

vtk-filename: tuning-pause
vtk-output-folder: output
vtk-write-frequency: 1