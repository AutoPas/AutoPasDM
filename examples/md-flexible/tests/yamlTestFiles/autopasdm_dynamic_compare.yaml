# Short dynamic AutoPas-vs-AutoPasDM regression.
#
# Run both implementations with 8 MPI ranks on a 2 x 2 x 2 process grid.
# Three particles start just below an internal rank boundary and move across
# the x, y, and z boundaries. A separate pair exercises LJ force evaluation
# while the simulation advances with a non-zero time step.

container: [DirectSum]
traversal: [ds_sequential]
data-layout: [AoS]
newton3: [enabled]
functor: lennard-jones

cutoff: 1.5
verlet-skin-radius: 0.0
tuning-strategies: []
tuning-phases: 0

box-min: [0.0, 0.0, 0.0]
box-max: [8.0, 8.0, 8.0]

deltaT: 0.002
iterations: 100

boundary-type: [periodic, periodic, periodic]
subdivide-dimension: [true, true, true]
load-balancer: None

vtk-filename: autoPasDMDynamicCompare
vtk-write-frequency: 100
no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 1.0
    mass: 1.0

Objects:
  CubeGrid:
    # Crosses the internal x boundary at x = 4.
    0:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [3.95, 1.0, 1.0]
      velocity: [0.5, 0.0, 0.0]
      particle-type-id: 0

    # Crosses the internal y boundary at y = 4.
    1:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [1.0, 3.95, 6.5]
      velocity: [0.0, 0.5, 0.0]
      particle-type-id: 0

    # Crosses the internal z boundary at z = 4.
    2:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [6.5, 1.0, 3.95]
      velocity: [0.0, 0.0, 0.5]
      particle-type-id: 0

    # Interacting LJ pair away from the internal boundaries.
    3:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [1.0, 6.0, 1.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
    4:
      particles-per-dimension: [1, 1, 1]
      particle-spacing: 0.2
      bottomLeftCorner: [2.2, 6.0, 1.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
