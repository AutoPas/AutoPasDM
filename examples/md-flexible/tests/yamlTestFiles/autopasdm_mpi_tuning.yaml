# Small two-rank scenario for the AutoPas MPI divide-and-conquer tuning path.

container: [DirectSum, LinkedCells]
traversal: [ds_sequential, lc_c08]
data-layout: [AoS]
newton3: [disabled, enabled]
functor: lennard-jones

cutoff: 1.0
verlet-skin-radius: 0.0
tuning-strategies: [mpi-divide-and-conquer]
tuning-interval: 100
tuning-samples: 1
tuning-phases: 1

box-min: [0.0, 0.0, 0.0]
box-max: [8.0, 8.0, 8.0]

deltaT: 0.0
iterations: 2

boundary-type: [periodic, periodic, periodic]
load-balancer: none

no-progress-bar: true
no-end-config: true

Sites:
  0:
    epsilon: 1.0
    sigma: 0.2
    mass: 1.0

Molecules:
  0:
    site-types: [0]
    relative-site-positions: [[0.0, 0.0, 0.0]]
    moment-of-inertia: [1.0, 1.0, 1.0]

Objects:
  CubeGrid:
    0:
      particles-per-dimension: [4, 4, 4]
      particle-spacing: 0.5
      bottomLeftCorner: [3.0, 2.0, 2.0]
      velocity: [0.0, 0.0, 0.0]
      particle-type-id: 0
